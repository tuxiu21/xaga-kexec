# Watchdog profile for the kexec Ubuntu runtime.
#
# dev: keep an unconditional shell watchdog feed loop. Use this while
# developing, flashing, testing kexec, or changing network services.
#
# unattended: gate watchdog kicks on basic local/remote health checks. Start
# with WATCHDOG_DRY_RUN=1 and observe for at least 24-48 hours before allowing
# it to stop feeding the hardware watchdog.
WATCHDOG_MODE=dev
WATCHDOG_DRY_RUN=1

WATCHDOG_FEED_INTERVAL=5
WATCHDOG_CHECK_INTERVAL=60
WATCHDOG_BOOT_GRACE=600
WATCHDOG_FAIL_THRESHOLD=10
WATCHDOG_SELF_HEAL_AFTER=3

WATCHDOG_DNS_NAME=archive.ubuntu.com
WATCHDOG_CURL_TIMEOUT=10

# Optional space-separated external URLs. If set, at least one must be
# reachable for unattended health to pass.
WATCHDOG_HEALTH_URLS="https://www.baidu.com/ https://connect.rom.miui.com/generate_204 https://connectivitycheck.platform.hicloud.com/generate_204"
