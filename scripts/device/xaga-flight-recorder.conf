# Persistent flight recorder defaults.
#
# Disk heartbeats are deliberately sparse. High-signal kernel and health
# transitions are additionally copied to /dev/pmsg0 for recovery through
# pmsg-ramoops-0 after a panic or reset.
FLIGHT_HEARTBEAT_SEC=300
FLIGHT_DISK_MAX_BYTES=2097152
FLIGHT_DISK_FILES=8

# Keep this at or below 49152. The xaga kexec marker occupies the final 16
# bytes of the 64 KiB pmsg ramoops zone; a bounded writer must not wrap into it.
FLIGHT_PMSG_BUDGET_BYTES=49152
FLIGHT_EVENT_MAX_BYTES=512
