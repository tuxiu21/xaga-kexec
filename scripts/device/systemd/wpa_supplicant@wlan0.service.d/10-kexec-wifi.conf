[Unit]
After=kexec-wifi.service
Wants=kexec-wifi.service
ConditionPathExists=/etc/wpa_supplicant/wpa_supplicant-wlan0.conf

[Service]
ExecStartPre=/bin/bash -c 'for _ in $(seq 1 180); do [ "$(cat /lean/wifi_load_progress.txt 2>/dev/null)" = READY ] && [ -e /sys/class/net/wlan0 ] && break; sleep 1; done; [ "$(cat /lean/wifi_load_progress.txt 2>/dev/null)" = READY ] && [ -e /sys/class/net/wlan0 ] || { echo "wpa_supplicant@wlan0: timed out waiting for kexec Wi-Fi READY" >&2; exit 1; }; mac="${KEXEC_WLAN0_MAC:-00:08:22:2c:db:fc}"; cur="$(cat /sys/class/net/wlan0/address 2>/dev/null || true)"; if [ "$cur" != "$mac" ]; then ip link set dev wlan0 down || true; ip link set dev wlan0 address "$mac"; ip link set dev wlan0 up || true; fi; echo "wpa_supplicant@wlan0: wlan0 mac=$(cat /sys/class/net/wlan0/address 2>/dev/null)"'
Restart=on-failure
RestartSec=10
