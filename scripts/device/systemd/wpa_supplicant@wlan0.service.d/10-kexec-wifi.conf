[Unit]
After=kexec-wifi.service
Requires=kexec-wifi.service
ConditionPathExists=/etc/wpa_supplicant/wpa_supplicant-wlan0.conf

[Service]
ExecStartPre=/bin/bash -c 'for _ in $(seq 1 180); do [ "$(cat /lean/wifi_load_progress.txt 2>/dev/null)" = READY ] && [ -e /sys/class/net/wlan0 ] && exit 0; sleep 1; done; echo "wpa_supplicant@wlan0: timed out waiting for kexec Wi-Fi READY" >&2; exit 1'
