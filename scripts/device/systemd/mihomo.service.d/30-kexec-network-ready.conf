[Unit]
Wants=network-online.target
After=network-online.target kexec-wpa-supplicant.service systemd-networkd.service

[Service]
ExecStartPre=
ExecStartPre=/bin/bash -c 'for _ in $(seq 1 180); do if ip -4 -o addr show dev wlan0 scope global | grep -q . && ip -4 route show default dev wlan0 | grep -q .; then exit 0; fi; sleep 1; done; echo "mihomo: timed out waiting for wlan0 IPv4 and default route" >&2; exit 1'
Restart=always
RestartSec=10
TimeoutStartSec=210
